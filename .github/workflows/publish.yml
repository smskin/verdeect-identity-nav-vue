# Публикация пакета в npm по тегу.
#
# Токена в секретах нет намеренно: доверие установлено соединением
# Trusted Publisher на npmjs.com — npm проверяет OIDC-удостоверение
# GitHub Actions и по нему опознаёт этот репозиторий и этот файл.
# Отсюда два следствия, которые нельзя нарушать:
#   1. Имя файла (`publish.yml`) закреплено в настройке пакета и смене
#      не подлежит: переименование рвёт доверие, и его придётся создавать
#      заново.
#   2. Разрешение `id-token: write` обязательно — без него удостоверение
#      не выдаётся, и публикация падает на проверке прав.
name: publish

on:
    push:
        tags:
            - 'v*'

permissions:
    id-token: write
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # Node 22.14+ и npm 11.5.1+ — нижняя граница поддержки OIDC.
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'

            # Версии печатаются в журнал: при отказе публикации это первое,
            # что нужно знать, и искать его задним числом негде.
            - run: node --version
            - run: npm --version

            - run: npm ci

            # Тег — обещание потребителю, что установится именно эта версия.
            # Разойдясь с `version`, он поставит другую, и понять это можно
            # будет только по содержимому архива.
            - name: Сверить версию пакета с тегом
              run: |
                  version="v$(node -p "require('./package.json').version")"

                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Тег $GITHUB_REF_NAME не совпадает с версией $version в package.json"
                      exit 1
                  fi

            # Четыре проверки пакета: словарь, изоляция каталога, типы,
            # правило подсветки. Браузер не поднимается ни одной, поэтому
            # `playwright install` здесь не нужен.
            - run: npm test

            # Без токена: удостоверение подставляет сам npm.
            # `--access public` не указывается — он объявлен в publishConfig.
            - run: npm publish
